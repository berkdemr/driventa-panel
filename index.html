<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driventa İşletme – Filo Paneli</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101B32">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
:root{
  --bg:#101B32; --bg-2:#0C1528; --card:#1C2B46; --card-2:#233554; --line:#2A3C5C;
  --accent:#FF8A32; --accent-soft:rgba(255,138,50,.12);
  --text:#FFFFFF; --text-2:#A9B6CC; --success:#35C98A; --error:#FF6B6B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hidden{display:none!important}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;font-weight:600;font-size:14.5px;transition:filter .15s}
.btn-primary{background:var(--accent);color:#101B32}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--card-2);border:1px solid var(--line)}
.btn-block{width:100%}
.btn[disabled]{opacity:.6;pointer-events:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.input{width:100%;height:46px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:0 14px;outline:none;font-size:15px}
.input:focus{border-color:var(--accent)}
.alert{border-radius:12px;padding:11px 14px;font-size:13.5px;margin-bottom:14px}
.alert.err{background:rgba(255,107,107,.12);color:var(--error)}
.alert.ok{background:rgba(53,201,138,.12);color:var(--success)}
.muted{color:var(--text-2)}
.link{color:var(--accent);font-weight:500}

/* Auth */
.auth{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.auth-side{background:linear-gradient(150deg,#1C2B46,#0C1528);padding:56px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.auth-side h2{font-size:34px;line-height:1.15;margin:28px 0 14px;font-weight:800}
.auth-side h2 span{color:var(--accent)}
.auth-side ul{list-style:none;display:grid;gap:12px;margin-top:22px;color:#D5DDEA}
.auth-side li{display:flex;gap:10px}
.auth-side li svg{color:var(--success)}
.auth-main{display:grid;place-items:center;padding:32px}
.auth-card{width:100%;max-width:400px}
.auth-card h1{font-size:26px;margin-bottom:6px}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;margin:22px 0}
.tabs button{flex:1;height:38px;border-radius:9px;color:var(--text-2);font-weight:600;font-size:14px}
.tabs button.on{background:var(--accent);color:#101B32}
.or{display:flex;align-items:center;gap:12px;color:var(--text-2);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;height:46px;border-radius:12px;background:#fff;color:#1f1f1f;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.brand img{width:36px;height:36px;border-radius:10px}
.brand small{display:block;font-size:11px;letter-spacing:1.4px;color:var(--accent);font-weight:700}

/* Center card (onboarding etc.) */
.center{min-height:100%;display:grid;place-items:center;padding:32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.center .card{width:100%;max-width:480px}

/* Shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{background:var(--bg-2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .brand{padding:4px 8px 18px}
.nav-item{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:11px;color:var(--text-2);font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.on{background:var(--accent-soft);color:var(--accent)}
.nav-item .soon{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--text-2);background:var(--card-2);padding:2px 7px;border-radius:999px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;font-weight:700}
.me b{display:block;font-size:14px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--text-2);font-size:12px}
.main{padding:28px 34px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px}
.top h1{font-size:26px;font-weight:800}
.top p{color:var(--text-2);font-size:14px}
.menu-btn{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi small{color:var(--text-2);font-size:13px}
.kpi b{display:block;font-size:24px;margin-top:6px}
.empty{text-align:center;padding:40px 20px}
.empty .ic{width:60px;height:60px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.empty .ic svg{width:28px;height:28px}
.empty h3{font-size:17px;margin-bottom:6px}
.empty p{color:var(--text-2);max-width:420px;margin:0 auto}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;font-weight:800;letter-spacing:6px;color:var(--accent);background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:14px 20px;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--text-2);font-weight:500;padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 8px;border-bottom:1px solid rgba(42,60,92,.6)}
.role{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--card-2);color:var(--text-2)}
.role.owner{background:var(--accent-soft);color:var(--accent)}
.role.driver{background:rgba(53,201,138,.12);color:var(--success)}
.steps{counter-reset:s;list-style:none;display:grid;gap:10px;margin-top:14px}
.steps li{display:flex;gap:12px;color:#D5DDEA;font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#1E5A47;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:50;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#5A1E2A}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}


/* Araçlar */
.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px;max-width:380px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-2)}
.search .input{padding-left:40px;height:44px}
.tb-actions{display:flex;gap:10px;flex-wrap:wrap}
.vt td{vertical-align:middle}
.vt th:first-child,.vt td:first-child{padding-left:18px}
.num{text-align:right;white-space:nowrap}
.plate{display:inline-flex;background:#fff;color:#111;border-radius:6px;font-weight:700;font-size:13px;letter-spacing:.6px;overflow:hidden;border:1.5px solid #111;height:26px;white-space:nowrap}
.plate i{font-style:normal;background:#1A4BB5;color:#fff;font-size:8px;padding:0 4px;display:grid;place-items:center}
.plate b{padding:0 7px;display:grid;place-items:center}
.sel{height:38px;font-size:13.5px;padding:0 10px;min-width:160px;max-width:220px}
.acts{white-space:nowrap;text-align:right;padding-right:14px!important}
.icon{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--text-2)}
.icon:hover{background:var(--card-2);color:var(--text)}
.icon.danger:hover{color:var(--error)}
.tfoot{padding:12px 18px;font-size:13px;color:var(--text-2);border-top:1px solid var(--line)}
.btn-danger{background:rgba(255,107,107,.14);color:var(--error)}
.modal-wrap{position:fixed;inset:0;background:rgba(5,10,22,.65);z-index:40;display:grid;place-items:center;padding:20px;overflow:hidden;overscroll-behavior:contain}
.modal{background:#16233D;border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:560px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto;overscroll-behavior:contain;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.wide{max-width:860px}
.m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.m-head h3{font-size:19px}
.m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field .msg{display:none;color:var(--error);font-size:12.5px;margin-top:5px}
.field.err .input{border-color:var(--error)}
.field.err .msg{display:block}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:14px;padding:26px;cursor:pointer;text-align:center}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:28px;height:28px;color:var(--accent)}
.sum{display:flex;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px}
.pill.ok{background:rgba(53,201,138,.14);color:var(--success)}
.pill.bad{background:rgba(255,107,107,.14);color:var(--error)}
.prev{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.prev .tbl th{position:sticky;top:0;background:#16233D}
.prev tr.bad td{background:rgba(255,107,107,.05)}
.okc{color:var(--success)}
.errc{color:var(--error);font-size:12.5px}
/* Kayıt onayları */
.nav-item .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:#101B32;font-size:12px;font-weight:800;display:grid;place-items:center}
a.kpi{color:inherit;text-decoration:none;display:block;transition:border-color .15s}
a.kpi:hover{border-color:var(--accent)}
.ap-tabs{margin:0 0 16px;max-width:560px}
.ap td{vertical-align:middle}
.ap .ck{width:44px;padding-left:18px!important}
.ap input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.ap tr.sel td{background:rgba(255,138,50,.06)}
.kmup{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:2px}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:6px}
.btn-sm svg{width:16px;height:16px}
.btn-ok{background:rgba(53,201,138,.14);color:var(--success)}
.acts .btn + .btn{margin-left:6px}
.chip{height:34px;padding:0 14px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);color:var(--text-2);font-size:13px;font-weight:500}
.chip:hover{color:var(--text)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
textarea.input{height:auto;padding:12px 14px;resize:vertical;line-height:1.4;font-family:inherit;font-size:14.5px;color:inherit}
.ap-tabs button{white-space:nowrap}
.input.err-b{border-color:var(--error)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Raporlar */
.rp-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:2px}
.seg button{height:36px;padding:0 14px;border-radius:9px;color:var(--text-2);font-weight:600;font-size:13.5px;white-space:nowrap}
.seg button.on{background:var(--accent);color:#101B32}
.rp-dates{display:flex;align-items:center;gap:8px}
.rp-dates .input{height:44px;width:auto;color-scheme:dark}
.rp-sel{width:auto;min-width:200px;height:44px;flex:1;max-width:320px}
#rpXls{margin-left:auto}
.rp-note{font-size:13px;margin:0 0 16px}
.kpi-sub{display:block;color:var(--text-2);font-size:12.5px;margin-top:4px}
.rp-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.rp-h{font-size:16px;margin-bottom:12px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;stroke:none;stroke-width:0}
.chart svg text{stroke:none}
.chart .gl{stroke:rgba(42,60,92,.7);stroke-width:1}
.chart .bl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--text-2);font-size:11px}
.chart .hit{fill:transparent;cursor:pointer}
.chart .bf{fill:var(--accent)}
.chart .bar.on .hit{fill:rgba(255,255,255,.04)}
.chart .bar.on .bf{filter:brightness(1.12)}
.tip{position:absolute;top:0;transform:translate(-50%,-6px);background:#0B1426;border:1px solid var(--line);border-radius:10px;padding:7px 11px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;font-size:13px}
.tip.show{opacity:1}
.tip small{display:block;color:var(--text-2);font-size:11.5px}
.hb{margin-bottom:13px}
.hb-top{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px}
.hb-track{height:8px;border-radius:999px;background:var(--bg)}
.hb-fill{height:100%;border-radius:999px;background:var(--accent)}
.rp-t tr.dim td{color:var(--text-2)}

/* Bakım takvimi */
.m-sec{font-size:14.5px;margin:6px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.m-sec .muted{font-weight:400;font-size:13px}
.g2.in{gap:0 10px;grid-template-columns:1fr 1fr!important}
button.kpi{text-align:left;cursor:pointer;color:inherit;transition:border-color .15s}
button.kpi:hover{border-color:var(--accent)}
.kpi.k-late{border-color:rgba(255,107,107,.5)}
.kpi.k-late b{color:var(--error)}
.kpi.k-soon b{color:var(--accent)}
.st-b{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-b.late{background:rgba(255,107,107,.14);color:var(--error)}
.st-b.soon{background:var(--accent-soft);color:var(--accent)}
.st-b.ok{background:rgba(53,201,138,.12);color:var(--success)}
.st-b.miss{background:var(--card-2);color:var(--text-2);margin:2px 0}
.rem{white-space:nowrap;font-size:13.5px}
.mt-t{min-width:760px}
.rem.late{color:var(--error);font-weight:600}
.rem.soon{color:var(--accent);font-weight:600}
.rem.ok{color:var(--text-2)}
.mt-alert{display:flex;align-items:center;gap:14px;margin-bottom:16px;color:inherit;text-decoration:none;border:1px solid rgba(255,138,50,.4)}
.mt-alert.late{border-color:rgba(255,107,107,.5)}
.mt-alert .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.mt-alert.late .ic{background:rgba(255,107,107,.14);color:var(--error)}
.mt-alert small{display:block;color:var(--text-2);font-size:13px;margin-top:2px}
.mt-alert .go{margin-left:auto;color:var(--accent);font-weight:600;font-size:13.5px;white-space:nowrap}

.fis-link{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.fis-link svg{width:14px;height:14px}
.fis-box{text-align:center;background:var(--bg);border-radius:12px;padding:10px;min-height:120px}
.fis-box img{max-width:100%;max-height:65vh;border-radius:8px;display:block;margin:0 auto;background:#fff}
.ck-row{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--text-2);margin:4px 0 18px;line-height:1.45;cursor:pointer}
.ck-row input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex-shrink:0}
tr.dim td{opacity:.6}
.sm-only{display:none}

@media (max-width:900px){
  .sm-only{display:block}
  .mt-alert .go{display:none}
  .rp-grid{grid-template-columns:1fr}
  .seg{width:100%;overflow-x:auto}
  .seg button{flex:1;padding:0 10px}
  .rp-sel{max-width:none}
  #rpXls{margin-left:0;width:100%}
  .hm{display:none}
  .g2{grid-template-columns:1fr}
  .toolbar .search{max-width:none}
  .tb-actions .btn{flex:1}
  .modal{padding:18px}
}

@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .menu-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--card)}
  .main{padding:20px 16px 60px}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .top h1{font-size:22px}
}
</style>
</head>
<body>
<div id="root"><div class="center"><div class="spinner"></div></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js?v=0.8"></script>
</body>
</html>
